org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
# The head of the version; CI appends the run number through -PVERSION. Plain `version`, which Gradle
# reads on its own and which sborka's determine-version action expects by default — `telek.version`
# was one more name for the same thing.
version=0.2.0

# WHAT THIS REPOSITORY TELLS THE SHARED CONVENTIONS.
sborka.group=io.github.youndie.telek
sborka.repository=youndie/telek
sborka.description=A Telegram bot state machine for Kotlin: routing, persistence and a transport-agnostic core.
sborka.inceptionYear=2026

# 21 for both. The floor is not a guess: these jars are compiled by a toolchain of 21 and nothing
# here needs a newer Java, so a consumer on 21 must be able to load them — and the metadata has to
# say so, or that consumer resolves the library, compiles against it, and meets
# UnsupportedClassVersionError at class loading.
sborka.jvmToolchain=21
sborka.jvmFloor=21
kotlin.native.ignoreDisabledTargets=true
# The KMP build (8 modules x jvm/linuxX64/linuxArm64, plus Kotlin/Native linking) exhausts the
# Gradle daemon's default 384m Metaspace and dies with "garbage collector is thrashing and
# after running out of JVM Metaspace" — reproduced on a 20-core Linux box, not a local quirk.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g

# OFF, AND IT SHOULD NOT STAY OFF. `explicitApi()` is right for a published library and sborka turns
# it on by default; here it costs 359 errors across 23 files. Spelling out a visibility and a return
# type on every public declaration is a change to the LIBRARY, not to how it is built — folded into
# the migration it would bury whatever the migration itself breaks in a diff nobody can read. viddik
# took it in the same PR because there it was 38; the rule is the size, not the flag.
# Tracked separately: youndie/telek#2.
sborka.explicitApi=false
