# The steps this file used to spell out live in sborka now — `.github/workflows/publish-wip.yaml`,
# called below — because telek, viddik and petich were spelling out the same ones. What stays here
# is what is true of telek and not of the others: which tasks, and why those.
name: Publish telek wip snapshots

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  publish:
    # Granted here rather than in the called workflow: a called job cannot be given more than the
    # job calling it has, so a `contents: write` over there would fail every caller that does not
    # deploy Pages. The one step that needs it is the dokka deploy.
    permissions:
      contents: write
    uses: youndie/sborka/.github/workflows/publish-wip.yaml@main
    with:
      # `build` rather than `test ktlintCheck`: the multiplatform modules have no `test` task at all
      # (they have `jvmTest` / `linuxX64Test` / `allTests`), so a bare `test` would silently cover
      # only :telegram and :router-telegram. `build` runs every target's tests, ktlint, and the
      # native compile+link.
      #
      # `publishAllPublicationsToWipRepository` rather than a single named publication for the same
      # reason: a KMP module publishes `kotlinMultiplatform` plus one publication per target, so a
      # task named after one publication would quietly publish 2 modules out of 8.
      tasks: build publishAllPublicationsToWipRepository dokkaGenerate
      # The default runner, and for telek's own reason: ubuntu is the only one that can *execute*
      # the linuxX64 tests instead of merely cross-compiling them. (linuxArm64 is still
      # compile-and-link only — an x86-64 host can't run those binaries.)
      runner: ubuntu-latest
      konan-cache: true
      test-results: true
      dokka: true
    # Named one by one rather than `secrets: inherit`: this hands them to a workflow in another
    # repository, and the two it needs are the two it gets.
    secrets:
      REPOSILITE_USER: ${{ secrets.REPOSILITE_USER }}
      REPOSILITE_SECRET: ${{ secrets.REPOSILITE_SECRET }}
