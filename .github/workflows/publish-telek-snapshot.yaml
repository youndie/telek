name: Publish telek wip snapshots

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  publish-telek:
    # ubuntu isn't incidental any more: it's the only runner that can *execute* the
    # linuxX64 tests instead of merely cross-compiling them. (linuxArm64 is still
    # compile-and-link only — an x86-64 host can't run those binaries.)
    runs-on: [ ubuntu-latest ]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      # Java, Gradle and the Kotlin/Native cache in one step. setup-gradle caches ~/.gradle
      # but not ~/.konan, and the toolchain is a fresh ~1 GB download on every run without
      # it — the action keys that cache the same way this workflow did.
      - uses: youndie/sborka/.github/actions/setup-kotlin@main
        with:
          konan-cache: "true"

      # The head of the version from gradle.properties with the run number on the tail. The
      # action reads plain `version`, which is where the head lives now — it was
      # `telek.version`, one more name for the same thing, and the same lines of shell were
      # copied into three repositories.
      - name: Determine version
        id: ver
        uses: youndie/sborka/.github/actions/determine-version@main

      # `build` rather than `test ktlintCheck`: the multiplatform modules have no `test`
      # task at all (they have `jvmTest` / `linuxX64Test` / `allTests`), so a bare `test`
      # would silently cover only :telegram and :router-telegram. `build` runs every
      # target's tests, ktlint, and the native compile+link.
      #
      # `publishAllPublicationsToWipRepository` rather than a single named publication for the
      # same reason: a KMP module publishes `kotlinMultiplatform` plus one publication per
      # target, so a task named after one publication would quietly publish 2 modules out of 8.
      - name: Build, test and publish
        run: ./gradlew build publishAllPublicationsToWipRepository dokkaGenerate --no-daemon
        env:
          ORG_GRADLE_PROJECT_REPOSILITE_USER: ${{ secrets.REPOSILITE_USER }}
          ORG_GRADLE_PROJECT_REPOSILITE_SECRET: ${{ secrets.REPOSILITE_SECRET }}
          ORG_GRADLE_PROJECT_VERSION: ${{ steps.ver.outputs.version }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/test-results/**/TEST-*.xml'
          if-no-files-found: warn

      - name: Deploy dokka to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/dokka/html
          full_commit_message: "📚 Deploy Dokka documentation"
