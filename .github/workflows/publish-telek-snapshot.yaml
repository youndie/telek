# The steps this file used to spell out live in sborka now — `.github/workflows/publish-wip.yaml`,
# called below — because telek, viddik and petich were spelling out the same ones. What stays here
# is what is true of telek and not of the others: which tasks, and why those.
name: Publish telek wip snapshots

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  publish:
    # Granted here rather than in the called workflow: a called job cannot be given more than the
    # job calling it has, so a `contents: write` over there would fail every caller that does not
    # deploy Pages. The one step that needs it is the dokka deploy.
    permissions:
      contents: write
    uses: youndie/sborka/.github/workflows/publish-wip.yaml@main
    with:
      # `build` rather than `test ktlintCheck`: the multiplatform modules have no `test` task at all
      # (they have `jvmTest` / `linuxX64Test` / `allTests`), so a bare `test` would silently cover
      # only :telegram and :router-telegram. `build` runs every target's tests, ktlint, and the
      # native compile+link.
      #
      # `publishAllPublicationsToWipRepository` rather than a single named publication for the same
      # reason: a KMP module publishes `kotlinMultiplatform` plus one publication per target, so a
      # task named after one publication would quietly publish 2 modules out of 8.
      tasks: build publishAllPublicationsToWipRepository dokkaGenerate
      # The default runner, and for telek's own reason: ubuntu is the only one that can *execute*
      # the linuxX64 tests instead of merely cross-compiling them. (linuxArm64 is still
      # compile-and-link only — an x86-64 host can't run those binaries.)
      runner: ubuntu-latest
      konan-cache: true
      test-results: true
      dokka: true
      # WHAT A STRANGER GETS, checked after every publish: sborka's `consumer` job runs proba over
      # each line, with this run's version appended, against the snapshot repository — reading the
      # metadata back from the server and resolving the coordinate with a JVM consumer build.
      #
      # Every publication the build registers, one per line: the root of each multiplatform module,
      # its jvm / linuxx64 / linuxarm64 targets, and the two JVM-only modules. Derived, not typed:
      # `scripts/publications.init.gradle.kts` prints the set, and `build.yaml` fails a pull request
      # whose list and build disagree (`scripts/coordinates_listed.py`) — a new module or target is
      # a new coordinate, and without that check proba would stay green while never reading it.
      #
      # The linuxx64 / linuxarm64 lines are read too, and answer "undetermined" for one check:
      # proba's consumer build is a JVM project, which no klib variant matches. The checks that read
      # the metadata and the files still run on them. Linking a native binary against the published
      # coordinates is `ci/consumer`'s job, by hand.
      coordinates: |
        io.github.youndie.telek:core
        io.github.youndie.telek:core-jvm
        io.github.youndie.telek:core-linuxarm64
        io.github.youndie.telek:core-linuxx64
        io.github.youndie.telek:ktg
        io.github.youndie.telek:ktg-jvm
        io.github.youndie.telek:ktg-linuxarm64
        io.github.youndie.telek:ktg-linuxx64
        io.github.youndie.telek:persistence
        io.github.youndie.telek:persistence-jvm
        io.github.youndie.telek:persistence-linuxarm64
        io.github.youndie.telek:persistence-linuxx64
        io.github.youndie.telek:router
        io.github.youndie.telek:router-jvm
        io.github.youndie.telek:router-ktg
        io.github.youndie.telek:router-ktg-jvm
        io.github.youndie.telek:router-ktg-linuxarm64
        io.github.youndie.telek:router-ktg-linuxx64
        io.github.youndie.telek:router-linuxarm64
        io.github.youndie.telek:router-linuxx64
        io.github.youndie.telek:router-telegram
        io.github.youndie.telek:telegram
        io.github.youndie.telek:testing
        io.github.youndie.telek:testing-jvm
        io.github.youndie.telek:testing-linuxarm64
        io.github.youndie.telek:testing-linuxx64
    # Named one by one rather than `secrets: inherit`: this hands them to a workflow in another
    # repository, and the two it needs are the two it gets.
    secrets:
      REPOSILITE_USER: ${{ secrets.REPOSILITE_USER }}
      REPOSILITE_SECRET: ${{ secrets.REPOSILITE_SECRET }}
