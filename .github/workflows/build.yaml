name: Build

# THIS REPOSITORY HAD NOTHING THAT RAN ON A PULL REQUEST. The only workflow publishes, and it fires
# on a push to main and on dispatch — so every change was first built by CI *after* it was merged,
# and a red build was a red main rather than a red review.
# `push` on main as well, and not only `pull_request`. A green pull request was checked on its own
# base; what lands on main is a different tree, and nothing here ever built the merge commit. Two
# branches can each be green against the base they were cut from and disagree once both are in.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # ubuntu is not incidental: it is the only runner that can EXECUTE the linuxX64 tests rather than
    # merely cross-compile them. linuxArm64 stays compile-and-link either way — an x86-64 host cannot
    # run those binaries.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: youndie/sborka/.github/actions/setup-kotlin@main
        with:
          konan-cache: "true"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pyyaml

      # The index in backlog.md is generated from the frontmatter of the item files, and a generated
      # block nobody regenerates is worse than a hand-written one: it looks authoritative and is
      # stale. This also catches an id used twice and a `blocked_by` pointing at an item that does
      # not exist.
      #
      # `test -d` first, and it is not belt-and-braces: with no `docs/backlog` directory the script
      # prints "nothing checked" and exits 0, so a backlog that was moved or lost in a bad merge
      # scores as a pass. The script is byte-identical across the portfolio and is not forked here
      # for this; the guard goes in the caller instead.
      - run: |
          test -d docs/backlog
          python3 scripts/backlog_index.py --check

      # TelekLogger's documentation lists what a bot loses by leaving the default NoOp in place,
      # and says how many there are. That is a hand-written list beside a growing set: the seventh
      # logger call anybody adds makes it wrong, and nothing about adding one would say so.
      - run: python3 scripts/diagnostics_documented.py

      # A number that was free when the branch was cut but has been taken on the base since. The
      # refspec is explicit because `git fetch origin main` moves FETCH_HEAD and creates no
      # remote-tracking ref. Pull requests only — a push has no base to compare against.
      - if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin \
            "+refs/heads/$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"
          python3 scripts/backlog_index.py --against "origin/$GITHUB_BASE_REF"

      # `build` rather than `test ktlintCheck`: the multiplatform modules have no `test` task at all
      # — they have `jvmTest` / `linuxX64Test` / `allTests` — so a bare `test` would silently cover
      # only :telegram and :router-telegram. `build` runs every target's tests, ktlint, and the
      # native compile and link.
      - run: ./gradlew build --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/test-results/**/TEST-*.xml'
          if-no-files-found: warn
