[versions]
dokka = "2.1.0"
kotlin = "2.4.10"
kotlinxCoroutines = "1.11.0"
kotlinxSerializationJson = "1.11.0"
ktlint = "14.2.0"
kotlinTelegramBot = "10.0.0"
retrofit = "2.12.0" #kotlinTelegramBot requires
tgbotapi = "35.1.0"
atomicfu = "0.33.0"
okio = "3.18.1"
mockk = "1.14.11"

[libraries]
kotlinGradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlinxCoroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinTelegramBot = { module = "io.github.kotlin-telegram-bot.kotlin-telegram-bot:telegram", version.ref = "kotlinTelegramBot" }
kotlinxSerializationJson = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
kotlinxSerializationProperties = { module = "org.jetbrains.kotlinx:kotlinx-serialization-properties", version.ref = "kotlinxSerializationJson" }
retrofitCore = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
tgbotapi = { module = "dev.inmo:tgbotapi", version.ref = "tgbotapi" }
# Used as a plain library (locks only, no `atomic()` fields), so the atomicfu compiler plugin is
# deliberately not applied — see CLAUDE.md.
atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "atomicfu" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
okioFakeFileSystem = { module = "com.squareup.okio:okio-fakefilesystem", version.ref = "okio" }
kotlinxCoroutinesTest = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

[plugins]
dokkaPlugin = { id = "org.jetbrains.dokka", version.ref = "dokka" }
ktlintPlugin = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
serializationPlugin = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
