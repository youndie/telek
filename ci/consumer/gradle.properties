# A Kotlin/Native RELEASE link exhausts the Gradle JVM's default heap. This is Kotlin/Native's
# appetite rather than anything telek does -- telek's own gradle.properties carries the same line
# for the same reason -- but a consumer meets it as `e: Compilation failed: Java heap space` with
# nothing pointing at the cause, so it is written down here rather than rediscovered.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
